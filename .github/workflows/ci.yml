name: CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run Tests (with race detector)
        run: go test -race -v ./...

      - name: Test Build (Native)
        run: go build -trimpath -o bin/bandcamper ./cmd/bandcamper
